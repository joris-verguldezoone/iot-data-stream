services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_USER: tsuser
      POSTGRES_PASSWORD: tspassword
      POSTGRES_DB: tsdb
       - TZ=Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - ./timescaledb/data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.12.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" 
    depends_on:
      - timescaledb
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - timescaledb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Paris
    volumes:
      - grafana_data:/var/lib/grafana
      

  api-node:
    container_name: api-node
    build:
      context: ./nodejs-server
      dockerfile: Dockerfile
    depends_on:
      - timescaledb
    command: ["node", "dist/server.js"]
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - PORT=3333
      - DEBUG=prisma:config,prisma:client:setup
      - MQTT_URL=mqtt://mosquitto:1883
      - TZ=Europe/Paris
    ports:
      - "3333:3333"

  mqtt-producer:
    container_name: mqtt-producer
    build: ./nodejs-server
    command: ["node", "dist/mqtt/producer.js"]
    depends_on:
      - mosquitto
      - api-node
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - MQTT_URL=mqtt://mosquitto:1883
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  mqtt-consumer:
    container_name: mqtt-consumer
    build: ./nodejs-server
    command: ["node", "dist/mqtt/stateless-consumer.js"]
    # command: ["node", "dist/src/mqtt/statefull-consumer.js"]
    depends_on:
      - mosquitto
      - timescaledb
      - api-node
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - MQTT_URL=mqtt://mosquitto:1883
      - NODE_OPTIONS=--max-old-space-size=4096

  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

    volumes:
      - kafka:/var/lib/kafka/data

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kraft-kafka:
              properties:
                bootstrap.servers: "kafka-broker:9092"
    ports:
      - "9999:8080"

volumes:
  grafana_data:
  pgadmin_data:
  timescaledb:
  kafka: